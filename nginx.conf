# Nginx конфігурація для власного домену (наприклад yourdomain.com або 3dgallery.local)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com 3dgallery.local;

    # Максимальний розмір завантажуваних 3D файлів та фотографій (250 МБ)
    client_max_body_size 250M;

    # Gzip стиснення для прискорення передачі моделей та скриптів
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript model/gltf-binary model/gltf+json;
    gzip_proxied any;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Пряма роздача статичних файлів з кешуванням для високої швидкодії
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
